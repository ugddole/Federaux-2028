{% extends 'base.html' %}
{% block title %}{{ 'Modifier le matériel' if action == 'edit' else 'Nouveau matériel' }}{% endblock %}
{% block page_title %}
<i class="bi bi-box-seam-fill me-2"></i>{{ 'Modifier le matériel' if action == 'edit' else 'Nouveau matériel' }}
{% endblock %}

{% block content %}
<div class="row justify-content-center">
<div class="col-lg-6 col-md-8">
<div class="fscf-card">
<div class="fscf-card-body">
     <form method="POST">

      <div class="mb-3">
        <label class="form-label fw-bold">Intitulé <span class="text-danger">*</span></label>
        <input type="text" name="intitule" class="form-control" required maxlength="200"
               value="{{ item.intitule if item else '' }}" placeholder="Ex : Tables pliantes">
      </div>

      <div class="mb-3">
        <label class="form-label fw-bold">Description</label>
        <textarea name="description" class="form-control" rows="3"
                  placeholder="Détails, état, usage prévu (optionnel)…">{{ item.description if item else '' }}</textarea>
      </div>

      <div class="row g-3 mb-4">
        <div class="col-6">
          <label class="form-label fw-bold">Fournisseur</label>
          <input type="text" name="fournisseur" class="form-control"
                 value="{{ item.fournisseur if item else '' }}" placeholder="Ex : Mairie de Dole">
        </div>
        <div class="col-6">
          <label class="form-label fw-bold">Quantité</label>
          <input type="number" name="quantite" class="form-control" min="0"
                 value="{{ item.quantite if item else 1 }}">
        </div>
      </div>

      <div class="mb-4">
        <label class="form-label fw-bold">Statut</label>
        <select name="statut" class="form-select">
          {% set current_statut = item.statut if item and item.statut else 'a_faire' %}
          {% for cle, libelle in MATERIEL_STATUTS.items() %}
          <option value="{{ cle }}" {% if cle == current_statut %}selected{% endif %}>{{ libelle }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="d-flex gap-2">
        <button type="submit" class="btn-fscf px-4 py-2">
          <i class="bi bi-check-lg me-1"></i>{{ 'Mettre à jour' if action == 'edit' else 'Ajouter' }}
        </button>
        <a href="{{ url_for('materiel_list') }}" class="btn btn-outline-secondary px-4 py-2">Annuler</a>
      </div>

    </form>
  </div>
</div>
</div>
</div>
{% endblock %}
