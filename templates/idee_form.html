{% extends 'base.html' %}
{% block title %}Proposer une idée{% endblock %}
{% block page_title %}<i class="bi bi-lightbulb-fill me-2"></i>Proposer une idée{% endblock %}

{% block content %}
<div class="fscf-card" style="max-width:720px;">
  <div class="fscf-card-header"><i class="bi bi-pencil-square me-2"></i>Ton idée</div>
  <div class="fscf-card-body">
    <form method="post">
      <div class="mb-3">
        <label class="form-label fw-semibold">Titre *</label>
        <input type="text" name="titre" class="form-control" required maxlength="150"
               placeholder="Ex. : Un point photo à l'entrée du stade" value="{{ form.get('titre', '') }}">
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Catégorie</label>
        <select name="categorie" class="form-select">
          <option value="">— Choisir (facultatif) —</option>
          {% for c in categories %}
          <option value="{{ c }}" {% if form.get('categorie') == c %}selected{% endif %}>{{ c }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Description</label>
        <textarea name="description" class="form-control" rows="6"
                  placeholder="Explique ton idée : le besoin, comment la mettre en place, qui pourrait s'en occuper…">{{ form.get('description', '') }}</textarea>
      </div>
      <div class="d-flex flex-wrap gap-2">
        <button type="submit" class="btn-fscf px-4 py-2"><i class="bi bi-send-fill me-1"></i>Envoyer</button>
        <a href="{{ url_for('idees_list') }}" class="btn-fscf-outline text-decoration-none px-4 py-2">Annuler</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
